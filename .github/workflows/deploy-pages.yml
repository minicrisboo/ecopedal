name: Deploy Ecopedal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare frontend artifact
        run: |
          mkdir -p _site/js
          cp index.html styles.css _site/
          cp -R js/. _site/js/
          touch _site/.nojekyll

      - name: Configure API origin
        env:
          API_BASE_URL: ${{ vars.ECOPEDAL_API_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const indexPath = '_site/index.html';
          const html = await readFile(indexPath, 'utf8');
          const value = process.env.API_BASE_URL?.trim();
          let apiOrigin = '';
          if (value) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.pathname !== '/' || url.search || url.hash) {
              throw new Error('ECOPEDAL_API_URL debe ser un origen HTTPS, por ejemplo https://api.example.com');
            }
            apiOrigin = url.origin;
          } else {
            console.warn('ECOPEDAL_API_URL no está definida. Se publicará la interfaz, pero la autenticación requiere desplegar primero la API.');
          }

          const configured = html.replace(
            /(<meta name="ecopedal-api-url" content=")[^"]*(")/,
            (_match, prefix, suffix) => `${prefix}${apiOrigin}${suffix}`,
          );
          if (configured === html) throw new Error('No se encontró la meta ecopedal-api-url en index.html.');
          await writeFile(indexPath, configured);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4